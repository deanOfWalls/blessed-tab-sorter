<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Blue gradient circle with border -->
  <circle cx="64" cy="64" r="58" fill="url(#blueGrad)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  
  <!-- Letter B -->
  <text x="64" y="88" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle" filter="url(#glow)">B</text>
  
  <!-- Golden halo -->
  <circle cx="64" cy="38" r="18" fill="none" stroke="#FFD700" stroke-width="3" 
          opacity="0.9" filter="url(#glow)"/>
  <circle cx="64" cy="38" r="15" fill="none" stroke="#FFA500" stroke-width="1.5" 
          opacity="0.7"/>
  
  <!-- Sparkles around halo -->
  <g opacity="0.9">
    <!-- Left sparkles -->
    <path d="M 38 38 L 42 38 L 40 34 L 40 42 Z" fill="white" transform="rotate(-45 40 38)"/>
    <path d="M 32 32 L 35 32 L 33.5 29 L 33.5 35 Z" fill="white" transform="rotate(-45 33.5 32)"/>
    <path d="M 28 28 L 30 28 L 29 26 L 29 30 Z" fill="white" transform="rotate(-45 29 28)"/>
    
    <!-- Right sparkles -->
    <path d="M 90 38 L 86 38 L 88 34 L 88 42 Z" fill="white" transform="rotate(45 88 38)"/>
    <path d="M 96 32 L 93 32 L 94.5 29 L 94.5 35 Z" fill="white" transform="rotate(45 94.5 32)"/>
    <path d="M 100 28 L 98 28 L 99 26 L 99 30 Z" fill="white" transform="rotate(45 99 28)"/>
    
    <!-- Top sparkles -->
    <path d="M 64 20 L 64 24 L 60 22 L 68 22 Z" fill="white"/>
    <path d="M 64 16 L 64 19 L 61 17.5 L 67 17.5 Z" fill="white"/>
    
    <!-- Additional small sparkles -->
    <circle cx="50" cy="30" r="1.5" fill="white"/>
    <circle cx="78" cy="30" r="1.5" fill="white"/>
    <circle cx="45" cy="35" r="1" fill="white"/>
    <circle cx="83" cy="35" r="1" fill="white"/>
  </g>
</svg>
